# Local benchmark: text-heavy dlt initial load with Arrow extraction and Postgres Parquet/ADBC.
pipeline:
  name: stackoverflow2013_posts_parquet_adbc_bench

source:
  type: mssql
  secret_id: source_mssql_stackoverflow
  host: mssql-bench
  port: 1433
  database: StackOverflow2013
  schema: dbo
  driver: "ODBC Driver 18 for SQL Server"
  options:
    Encrypt: "yes"
    TrustServerCertificate: "yes"

target:
  type: postgres
  secret_id: target_postgres_main
  host: pg-bench
  port: 5432
  database: so2013_dlt
  schema_alias: adbcposts
  sslmode: disable

tables:
  include:
    - Posts

load:
  write_disposition: replace
  chunk_size: 100000

dlt:
  sql_backend: pyarrow
  loader_file_format: parquet
  data_writer_file_max_items: 100000
  normalize_file_max_items: 100000
  load_workers: 5
