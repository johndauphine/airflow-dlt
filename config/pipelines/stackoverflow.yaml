# Example pipeline: replicate StackOverflow2010 tables from MSSQL to Postgres.
# Trigger the dag with: {"config_name": "stackoverflow"}

pipeline:
  name: stackoverflow_mssql_to_postgres
  schedule: null               # manual trigger; cron string ok here too
  retries: 3
  retry_delay_seconds: 30

source:
  type: mssql
  secret_id: source_mssql_stackoverflow
  host: mssql-server
  port: 1433
  database: StackOverflow2010
  schema: dbo
  driver: "ODBC Driver 18 for SQL Server"
  options:
    TrustServerCertificate: "yes"

target:
  type: postgres
  secret_id: target_postgres_main
  host: postgres-target
  port: 5432
  database: stackoverflow
  schema_alias: dev            # → dataset name "dev__stackoverflow2010__dbo"

tables:
  include:
    - Badges
    - Comments
    - LinkTypes
    - PostLinks
    - Posts
    - PostTypes
    - Users
    - Votes
    - VoteTypes
  overrides:
    Users:
      write_disposition: merge
      primary_key: Id
      incremental:
        cursor_path: LastAccessDate

load:
  write_disposition: replace
  chunk_size: 100000
