# Example: replicate the `app` schema from one Postgres into another.
# Trigger the `dlt_pipeline` DAG with:  {"config_name": "example_postgres_to_postgres"}

pipeline:
  name: pg_app_replication

source:
  type: postgres
  secret_id: source_pg_app
  host: source-pg
  port: 5432
  database: app
  schema: public
  sslmode: prefer

target:
  type: postgres
  secret_id: target_postgres_main
  host: postgres-target
  port: 5432
  database: warehouse
  schema_alias: prod    # → dataset name "prod_app_public"

tables:
  include:
    - customers
    - orders
  overrides:
    customers:
      write_disposition: merge
      primary_key: id
      incremental:
        cursor_path: updated_at

load:
  write_disposition: replace
  chunk_size: 50000
