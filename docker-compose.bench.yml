services:
  mssql-bench:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-bench
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD:-TestPass2024}
      - MSSQL_PID=Developer
      - MSSQL_MEMORY_LIMIT_MB=${MSSQL_BENCH_MEMORY_LIMIT_MB:-10240}
      - TZ=UTC
    ports:
      - "1433:1433"
    volumes:
      - mssql-bench-data:/var/opt/mssql
    networks:
      - dmt-bench
    mem_limit: ${MSSQL_BENCH_CONTAINER_MEM_LIMIT:-12g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  pg-bench:
    image: postgres:16-alpine
    container_name: pg-bench
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD:-TestPass2024}
    ports:
      - "5432:5432"
    volumes:
      - pg-bench-data:/var/lib/postgresql/data
    networks:
      - dmt-bench
    mem_limit: ${PG_BENCH_CONTAINER_MEM_LIMIT:-3g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mssql-bench-data:
    external: true
  pg-bench-data:
    external: true

networks:
  dmt-bench:
    external: true
